<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<link rel="apple-touch-icon" href="/favicon.png" />
		<script>
			(function () {
				var path = location.pathname;
				var onZhPath = path === '/zh' || path.startsWith('/zh/');
				var hasLocalePrefix = path.match(/^\/(zh|en)(\/|$)/);

				// 1. Check localStorage for explicit locale preference (PWA-persistent)
				try {
					var prefsRaw = localStorage.getItem('FL_preferences');
					if (prefsRaw) {
						var p = JSON.parse(prefsRaw);
						if (p.locale === 'zh' && !onZhPath) {
							location.replace('/zh');
							return;
						}
						if (p.locale === 'en' && onZhPath) {
							location.replace('/');
							return;
						}
						if (p.locale === 'en' || p.locale === 'zh') {
							return;
						}
					}
				} catch (e) {}

				// 2. Fallback: browser language auto-detection (first visit, no saved preference)
				if (document.cookie.indexOf('PARAGLIDE_LOCALE=') !== -1) return;
				if (navigator.languages && !hasLocalePrefix) {
					if (
						navigator.languages.some(function (l) {
							return l.startsWith('zh');
						})
					) {
						location.replace('/zh');
					}
				}
			})();
		</script>
		<style>
			html,
			body {
				background: #004400;
				margin: 0;
				padding: 0;
				height: 100%;
				overflow: hidden;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
