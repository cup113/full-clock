[package]
name = "full-clock"
version = "1.3.1"
description = "Full Clock desktop shell"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
rsntp = { version = "4", default-features = false }
tauri-plugin-opener = "2"
