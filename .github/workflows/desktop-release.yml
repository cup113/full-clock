name: Desktop release

# Builds the Windows desktop shell and publishes both artifacts on a `v*` tag.
# A manual run only uploads workflow artifacts, so the pipeline can be tested
# without publishing a release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # reads packageManager from package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm tauri build

      - name: Package portable build
        shell: pwsh
        run: |
          Compress-Archive -Path src-tauri/target/release/full-clock.exe `
            -DestinationPath "FullClock_${{ github.ref_name }}_x64-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            FullClock_*_x64-portable.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            FullClock_*_x64-portable.zip
